<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560">
<style>
  .bg{fill:#f8f4ec}.dock{fill:#d7c4aa}.dockText{font:700 24px DejaVu Sans, Arial, sans-serif;fill:#5b4732}
  .boat{fill:#fffdf8;stroke:#2d6f73;stroke-width:5}.deck{fill:#eef6f7}
  .fender{fill:#ff8f6b;stroke:#b85d45;stroke-width:2}.cleat{fill:#6b7c93}.label{font:700 18px DejaVu Sans, Arial, sans-serif;fill:#24323a}
  .small{font:600 16px DejaVu Sans, Arial, sans-serif;fill:#24323a}.note{font:500 15px DejaVu Sans, Arial, sans-serif;fill:#475761}
  .lineBlue{fill:none;stroke:#2d6f73;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .lineRust{fill:none;stroke:#c86445;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .lineGold{fill:none;stroke:#b78a2e;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .arrow{fill:none;stroke:#8c9aa1;stroke-width:4;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c9aa1"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f4ec"/>
<rect x="30" y="30" width="860" height="92" rx="14" class="dock"/>
<text x="460" y="86" text-anchor="middle" class="dockText">KAI</text>
<rect x="180" y="182" width="520" height="158" rx="78" class="boat"/>
<path d="M700 261 L760 261 L700 219 Z" class="boat"/>
<rect x="228" y="205" width="428" height="112" rx="54" class="deck"/>
<text x="445" y="267" text-anchor="middle" class="label">ARTEMIS längsseits</text>
<circle cx="205" cy="145" r="12" class="cleat"/><circle cx="455" cy="145" r="12" class="cleat"/><circle cx="695" cy="145" r="12" class="cleat"/>
<rect x="240" y="154" width="18" height="42" rx="8" class="fender"/>
<rect x="340" y="154" width="18" height="42" rx="8" class="fender"/>
<rect x="440" y="154" width="18" height="42" rx="8" class="fender"/>
<rect x="540" y="154" width="18" height="42" rx="8" class="fender"/>
<rect x="640" y="154" width="18" height="42" rx="8" class="fender"/>
<path d="M650 190 L720 115" class="lineBlue"/>
<text x="718" y="140" class="label">Vorleine</text>
<path d="M220 330 L118 115" class="lineBlue"/>
<text x="70" y="310" class="label">Achterleine</text>
<path d="M235 220 L520 115" class="lineRust"/>
<text x="476" y="166" class="label">Achterspring</text>
<path d="M655 302 L380 115" class="lineGold"/>
<text x="585" y="335" class="label">Vorspring</text>
<text x="64" y="410" class="small">Vor- und Achterleine sichern die Grundposition.</text>
<text x="64" y="438" class="note">Springs begrenzen die Bewegung längs des Kais.</text>
<text x="64" y="464" class="note">Standard: feste Enden an Bord, lose / Arbeitsenden an Land.</text>
<text x="64" y="490" class="note">Fender zuerst setzen, danach Leinen gleichmäßig nachsetzen.</text>
</svg>