<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560">
<style>
  .bg{fill:#f8f4ec}.dock{fill:#d7c4aa}.dockText{font:700 24px DejaVu Sans, Arial, sans-serif;fill:#5b4732}
  .boat{fill:#fffdf8;stroke:#2d6f73;stroke-width:5}.deck{fill:#eef6f7}
  .fender{fill:#ff8f6b;stroke:#b85d45;stroke-width:2}.cleat{fill:#6b7c93}.label{font:700 18px DejaVu Sans, Arial, sans-serif;fill:#24323a}
  .small{font:600 16px DejaVu Sans, Arial, sans-serif;fill:#24323a}.note{font:500 15px DejaVu Sans, Arial, sans-serif;fill:#475761}
  .lineBlue{fill:none;stroke:#2d6f73;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .lineRust{fill:none;stroke:#c86445;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .lineGold{fill:none;stroke:#b78a2e;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .arrow{fill:none;stroke:#8c9aa1;stroke-width:4;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c9aa1"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f4ec"/>
<rect x="30" y="424" width="860" height="96" rx="14" class="dock"/>
<text x="460" y="480" text-anchor="middle" class="dockText">KAI</text>
<path d="M300 80 Q460 32 620 80 L680 330 Q460 382 240 330 Z" class="boat"/>
<path d="M337 102 Q460 66 583 102 L628 300 Q460 340 292 300 Z" class="deck"/>
<text x="460" y="210" text-anchor="middle" class="label">ARTEMIS rückwärts am Kai</text>
<circle cx="190" cy="412" r="12" class="cleat"/><circle cx="355" cy="412" r="12" class="cleat"/><circle cx="565" cy="412" r="12" class="cleat"/><circle cx="730" cy="412" r="12" class="cleat"/>
<rect x="330" y="339" width="18" height="42" rx="8" class="fender"/>
<rect x="430" y="344" width="18" height="42" rx="8" class="fender"/>
<rect x="530" y="339" width="18" height="42" rx="8" class="fender"/>
<path d="M320 322 L208 408" class="lineBlue"/>
<path d="M600 322 L712 408" class="lineBlue"/>
<text x="74" y="345" class="label">Heckleine Bb</text>
<text x="650" y="345" class="label">Heckleine Stb</text>
<path d="M360 122 L355 408" class="lineRust"/>
<path d="M560 122 L565 408" class="lineGold"/>
<text x="95" y="136" class="label">optionale Bugleine / Spring</text>
<text x="60" y="60" class="small">Zwei Heckleinen sichern das Heck am Kai.</text>
<text x="60" y="86" class="note">Sie können parallel oder – wenn es der Platz verlangt – gekreuzt geführt werden.</text>
<text x="60" y="112" class="note">Bugleinen oder Springs stabilisieren das Vorschiff und reduzieren Längsbewegung.</text>
</svg>